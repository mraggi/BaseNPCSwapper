<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 372" width="1300" height="372">
  <defs>
    <!-- Deep glossy background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e35" />
      <stop offset="40%" stop-color="#1b1e23" />
      <stop offset="50%" stop-color="#111316" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    
    <!-- Glossy reflection highlight for the top half -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop shadow for 3D panel pop -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1300" height="372" fill="url(#bg)" />
  
  <!-- Global Gloss Overlay -->
  <rect width="1300" height="186" fill="url(#gloss)" />

  <!-- Center Accent Panel -->
  <rect x="200" y="86" width="900" height="200" rx="12" ry="12" fill="#181a1f" filter="url(#drop-shadow)" stroke="#3a404a" stroke-width="2"/>
  
  <!-- Panel Gloss Highlight -->
  <rect x="202" y="88" width="896" height="98" rx="12" ry="12" fill="#ffffff" opacity="0.03" />

  <!-- Main Title Text -->
  <text x="650" y="175" font-family="Segoe UI, Helvetica, sans-serif" font-size="76" font-weight="900" fill="#42a5f5" text-anchor="middle" filter="url(#drop-shadow)">
    BaseNPCSwapper
  </text>
  
  <!-- Subtext -->
  <text x="650" y="225" font-family="Segoe UI, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#e0e0e0" text-anchor="middle" letter-spacing="3">
    DYNAMIC IN-PLACE ACTOR SWAPPING
  </text>

  <text x="650" y="255" font-family="Courier New, monospace" font-size="16" fill="#888888" text-anchor="middle">
    Actor::Load3D [0x86] • Thread-Safe Polling • Zero Leveled List Conflicts
  </text>

  <!-- Decorative C++ Background Elements -->
  <text x="40" y="50" font-family="Courier New, monospace" font-size="14" fill="#42a5f5" opacity="0.3">
    <tspan x="40" dy="0">#include &lt;F4SE/F4SE.h&gt;</tspan>
    <tspan x="40" dy="20">#include "SwapRuleResolved.hpp"</tspan>
    <tspan x="40" dy="20">#include "serialization.hpp"</tspan>
  </text>

  <text x="40" y="310" font-family="Courier New, monospace" font-size="14" fill="#42a5f5" opacity="0.3">
    <tspan x="40" dy="0">std::lock_guard&lt;std::mutex&gt; lock(g_actorListMutex);</tspan>
    <tspan x="40" dy="20">QueueDeferredEvaluation(formID);</tspan>
  </text>
  
  <text x="1050" y="50" font-family="Courier New, monospace" font-size="14" fill="#42a5f5" opacity="0.3">
    <tspan x="1050" dy="0">Phase 1: Setup &amp; Leveled Data</tspan>
    <tspan x="1050" dy="20">Phase 2: Enable Trigger</tspan>
    <tspan x="1050" dy="20">Phase 3: FaceGen &amp; Reset3D</tspan>
    <tspan x="1050" dy="20">Phase 4: 3D Stream &amp; Equip</tspan>
  </text>
</svg>
