# project.conf — the single source of truth for this plugin's identity.
#
# xmake.lua does not read this file directly (xmake's description scope has no
# `io` module); it reads the generated project.lua mirror beside it. In the
# development tree a shell helper regenerates project.lua from this file on
# every build. If you edit VERSION here, edit CONF_VERSION in project.lua too.
#
# NOTE: the development tree also keeps build-machine settings here — a Windows
# cross-compile VM, a mod-manager directory, a Wine prefix log path. Those are
# specific to one machine and are not published; the placeholders below are only
# to show the shape. Nothing in the C++ build uses them.
#
# Format is deliberately dumb: KEY="value", one per line.

# ---------------------------------------------------------------- identity ---

# xmake target name, DLL basename, log file name, Data/F4SE/Plugins/<name>/ dir.
# Must be a valid C identifier-ish token: no spaces.
PLUGIN_NAME="BaseNPCSwapper"

# Human-readable name: the mod manager folder and the release zip.
MOD_NAME="Base NPC Swapper"

AUTHOR="mraggi"

# Semantic version. Ends up in the DLL resource and F4SEPlugin_Version.
VERSION="0.9.1"

DESCRIPTION="F4SE plugin: runtime NPC swapper / modifier"

# ---------------------------------------------------- build machine (local) ---

VM_USER="youruser"
VM_HOST="your.build.vm"
VM_ROOT="C:/build"
MODS_DIR="/path/to/your/mods"
GAME_LOG_DIR="/path/to/Documents/My Games/Fallout4/F4SE"
