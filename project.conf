# project.conf — the single source of truth for this plugin.
#
# Every build script sources this file, and xmake.lua parses it too, so the
# plugin name / version / author live in exactly ONE place. Change them here.
#
# Format is deliberately dumb: KEY="value", one per line. Nothing else. Both
# bash and the Lua parser in xmake.lua rely on that.

# ---------------------------------------------------------------- identity ---

# xmake target name, DLL basename, log file name, Data/F4SE/Plugins/<name>/ dir.
# Must be a valid C identifier-ish token: no spaces.
PLUGIN_NAME="BaseNPCSwapper"

# Human-readable name: the mod manager folder and the release zip.
MOD_NAME="Base NPC Swapper"

AUTHOR="mraggi"

# Semantic version. Ends up in the DLL resource, F4SEPlugin_Version and the
# release zip name. Must be MAJOR.MINOR.PATCH.
VERSION="0.9.5"

DESCRIPTION="F4SE plugin: runtime NPC swapper / modifier"

# ------------------------------------------------------- windows build vm ----

VM_USER="youruser"
VM_HOST="your.build.vm"

# Per-project build directory on the VM. BNS's existing layout is nested
# twice (matches the GitHub Actions runner convention this VM was set up
# with) — so VM_ROOT already includes the plugin name once, and
# scripts/_common.sh's VM_DIR="$VM_ROOT/$PLUGIN_NAME" adds the second.
VM_ROOT="C:/build"

# ------------------------------------------------------------ local paths ----

# Mod-manager mods root. The live, in-game copy of this mod is
# $MODS_DIR/$MOD_NAME — that is the folder pack_mod.sh verifies the zip against.
MODS_DIR="/path/to/your/mods"

GAME_LOG_DIR="/path/to/Documents/My Games/Fallout4/F4SE"
